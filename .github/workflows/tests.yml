name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run API tests
        run: dotnet test tests/Consultologist.Api.Tests.csproj --configuration Release

      - name: Run client render tests
        run: dotnet test tests/Consultologist.Web.Tests/Consultologist.Web.Tests.csproj --configuration Release
