name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Run API tests
        run: dotnet test tests/Consultologist.Api.Tests.csproj --configuration Release

      - name: Run client render tests
        run: dotnet test tests/Consultologist.Web.Tests/Consultologist.Web.Tests.csproj --configuration Release
